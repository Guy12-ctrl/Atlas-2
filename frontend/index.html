<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b14">

<title>ATLAS — Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#070b14;
  color:#f8fafc;
  font-family:Arial,Helvetica,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  min-height:100vh;
  background-image:
    linear-gradient(#ffffff06 1px,transparent 1px),
    linear-gradient(90deg,#ffffff06 1px,transparent 1px);
  background-size:44px 44px;
}

.nav{
  height:72px;
  border-bottom:1px solid #172236;
  background:#070b14e8;
  backdrop-filter:blur(18px);
  display:flex;
  align-items:center;
  padding:0 28px;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.grad{
  background:linear-gradient(90deg,#a78bfa,#22d3ee);
  color:transparent;
  background-clip:text;
}

.status{
  margin-left:auto;
  color:#7d8ba0;
  font-size:12px;
  display:flex;
  align-items:center;
  gap:7px;
}

.indicator{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#64748b;
}

.indicator.on{
  background:#22c55e;
  box-shadow:0 0 12px #22c55e;
}

.main{
  width:min(1100px,calc(100% - 32px));
  margin:auto;
  padding:55px 0;
}

.hero{
  margin-bottom:30px;
}

.hero h1{
  font-size:clamp(34px,6vw,58px);
  margin:0;
  letter-spacing:-3px;
}

.hero p{
  color:#8391a6;
  line-height:1.7;
}

.login-card,
.dashboard{
  background:#0b1220cc;
  border:1px solid #19263a;
  border-radius:18px;
  padding:28px;
}

.login-card{
  max-width:500px;
  margin:40px auto;
}

input{
  width:100%;
  padding:14px;
  margin-top:15px;
  border-radius:10px;
  border:1px solid #263249;
  background:#080e18;
  color:white;
  outline:none;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 16px;
}

.primary{
  width:100%;
  margin-top:12px;
  background:white;
  color:#07101a;
  font-weight:900;
}

.secondary{
  background:#111a29;
  color:white;
  border:1px solid #263249;
}

.error{
  margin-top:12px;
  color:#fca5a5;
  font-size:13px;
}

.dashboard{
  display:none;
}

.dashboard.show{
  display:block;
}

.login-card.hide{
  display:none;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.topbar h2{
  margin:0;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.stat{
  background:#080e18;
  border:1px solid #19263a;
  border-radius:14px;
  padding:20px;
}

.label{
  color:#7d8ba0;
  font-size:12px;
}

.value{
  margin-top:8px;
  font-size:25px;
  font-weight:800;
}

.account{
  margin-top:18px;
  padding:15px;
  background:#080e18;
  border-radius:12px;
  color:#b8c3d4;
}

.live{
  color:#22c55e;
}

@media(max-width:700px){

  .cards{
    grid-template-columns:1fr;
  }

  .nav{
    padding:0 16px;
  }

  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }

}

</style>
</head>

<body>

<div class="wrap">

<header class="nav">

  <div class="logo">
    <span class="grad">AT</span>LAS
  </div>

  <div class="status">
    <span id="indicator" class="indicator"></span>
    <span id="status">Non connecté</span>
  </div>

</header>

<main class="main">

<section class="hero">

  <h1>
    <span class="grad">ATLAS</span> Dashboard
  </h1>

  <p>
    Votre espace de trading connecté à Deriv.
  </p>

</section>

<!-- CONNEXION -->

<section id="loginCard" class="login-card">

  <h2>Connexion Deriv</h2>

  <p>
    Entrez votre Personal Access Token Deriv.
  </p>

  <input
    id="token"
    type="password"
    placeholder="API Token Deriv"
    autocomplete="off"
  >

  <button
    id="connect"
    class="primary"
  >
    Se connecter
  </button>

  <div id="error" class="error"></div>

</section>

<!-- DASHBOARD -->

<section id="dashboard" class="dashboard">

  <div class="topbar">

    <div>
      <h2>Vue d'ensemble</h2>
      <div class="live">
        ● Compte connecté
      </div>
    </div>

    <button
      id="logout"
      class="secondary"
    >
      Déconnexion
    </button>

  </div>

  <div class="cards">

    <div class="stat">

      <div class="label">
        Compte
      </div>

      <div
        id="accountId"
        class="value"
      >
        —
      </div>

    </div>

    <div class="stat">

      <div class="label">
        Solde
      </div>

      <div
        id="balance"
        class="value"
      >
        —
      </div>

    </div>

    <div class="stat">

      <div class="label">
        Devise
      </div>

      <div
        id="currency"
        class="value"
      >
        —
      </div>

    </div>

  </div>

  <div
    id="accountInfo"
    class="account"
  >
    Connexion au compte en cours...
  </div>

</section>

</main>

</div>

<script>

let socket = null;

function showError(message){

  document.getElementById("error").textContent =
    message || "";

}

function getAccountId(accounts){

  if(!accounts){
    return null;
  }

  if(Array.isArray(accounts)){

    const account = accounts[0];

    return (
      account?.account_id ||
      account?.accountId ||
      account?.loginid ||
      account?.login_id ||
      null
    );

  }

  if(typeof accounts === "object"){

    const keys = Object.keys(accounts);

    if(keys.length){

      const first = accounts[keys[0]];

      return (
        first?.account_id ||
        first?.accountId ||
        first?.loginid ||
        first?.login_id ||
        keys[0]
      );

    }

  }

  return null;
}

async function connect(){

  const token =
    document.getElementById("token").value.trim();

  if(!token){

    showError("Veuillez entrer votre API Token.");

    return;
  }

  showError("");

  const button =
    document.getElementById("connect");

  button.disabled = true;
  button.textContent = "Connexion...";

  try{

    const response = await fetch(
      "/auth/token",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          token
        })
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message ||
        "Connexion impossible."
      );

    }

    document.getElementById("token").value = "";

    document
      .getElementById("loginCard")
      .classList.add("hide");

    document
      .getElementById("dashboard")
      .classList.add("show");

    document
      .getElementById("status")
      .textContent =
      "Connecté à Deriv";

    document
      .getElementById("indicator")
      .classList.add("on");

    await loadAccount(data.accounts);

  }catch(error){

    showError(error.message);

  }finally{

    button.disabled = false;
    button.textContent = "Se connecter";

  }

}

async function loadAccount(accounts){

  const accountId =
    getAccountId(accounts);

  if(!accountId){

    document.getElementById(
      "accountInfo"
    ).textContent =
      "Compte connecté. Identifiant non disponible.";

    return;

  }

  document.getElementById(
    "accountId"
  ).textContent = accountId;

  try{

    const response = await fetch(
      "/api/deriv/otp",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          accountId
        })
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message ||
        "Impossible d'ouvrir le WebSocket."
      );

    }

    if(!data.url){

      throw new Error(
        "Deriv n'a pas fourni d'URL WebSocket."
      );

    }

    connectWebSocket(data.url);

  }catch(error){

    document.getElementById(
      "accountInfo"
    ).textContent =
      error.message;

  }

}

function connectWebSocket(url){

  socket = new WebSocket(url);

  socket.onopen = () => {

    document.getElementById(
      "accountInfo"
    ).textContent =
      "WebSocket Deriv connecté • Solde en temps réel activé.";

    socket.send(
      JSON.stringify({
        balance:1,
        subscribe:1
      })
    );

  };

  socket.onmessage = event => {

    try{

      const message =
        JSON.parse(event.data);

      if(message.msg_type === "balance"){

        const balance =
          message.balance;

        document.getElementById(
          "balance"
        ).textContent =
          Number(
            balance.balance
          ).toLocaleString(
            "fr-FR",
            {
              minimumFractionDigits:2,
              maximumFractionDigits:2
            }
          );

        document.getElementById(
          "currency"
        ).textContent =
          balance.currency || "—";

        if(balance.loginid){

          document.getElementById(
            "accountId"
          ).textContent =
            balance.loginid;

        }

      }

    }catch(error){

      console.error(
        "Erreur WebSocket:",
        error
      );

    }

  };

  socket.onerror = error => {

    console.error(
      "WebSocket error:",
      error
    );

    document.getElementById(
      "accountInfo"
    ).textContent =
      "Erreur WebSocket Deriv.";

  };

}

async function checkSession(){

  try{

    const response =
      await fetch(
        "/api/auth/status"
      );

    const data =
      await response.json();

    if(data.connected){

      document
        .getElementById("loginCard")
        .classList.add("hide");

      document
        .getElementById("dashboard")
        .classList.add("show");

      document
        .getElementById("status")
        .textContent =
        "Connecté à Deriv";

      document
        .getElementById("indicator")
        .classList.add("on");

      await loadAccount(
        data.accounts
      );

    }

  }catch(error){

    console.error(error);

  }

}

document
  .getElementById("connect")
  .addEventListener(
    "click",
    connect
  );

document
  .getElementById("logout")
  .addEventListener(
    "click",
    async () => {

      if(socket){

        socket.close();
        socket = null;

      }

      await fetch(
        "/auth/logout",
        {
          method:"POST"
        }
      );

      location.reload();

    }
  );

checkSession();

</script>

</body>
</html>
